openapi: 3.0.3
info:
  title: Blog API
  description: Blog endpoints for SEO-optimized content management
  version: 1.0.0

paths:
  /blogs:
    get:
      tags: [Blog - Public]
      summary: Get all published blogs
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Page number
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
            maximum: 50
          description: Items per page
        - in: query
          name: search
          schema:
            type: string
          description: Search in title, content, excerpt
        - in: query
          name: category
          schema:
            type: string
            enum: [Travel Tips, Destination Guides, Delhi Culture, Food & Cuisine, Adventure, News & Updates]
          description: Filter by category
        - in: query
          name: tag
          schema:
            type: string
          description: Filter by tag
        - in: query
          name: sortBy
          schema:
            type: string
            enum: [createdAt, publishedAt, views, title]
            default: createdAt
        - in: query
          name: order
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        "200":
          description: Blogs retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      blogs:
                        type: array
                        items:
                          $ref: "#/components/schemas/Blog"
                      pagination:
                        $ref: "#/components/schemas/Pagination"

    post:
      tags: [Blog - Admin]
      summary: Create a new blog post
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [title, content, category]
              properties:
                title:
                  type: string
                  example: "Top 10 Places to Visit in Delhi"
                content:
                  type: string
                  description: Rich HTML/Markdown content
                  example: "<p>Delhi is a city rich in history...</p>"
                excerpt:
                  type: string
                  maxLength: 300
                category:
                  type: string
                  enum: [Travel Tips, Destination Guides, Delhi Culture, Food & Cuisine, Adventure, News & Updates]
                tags:
                  type: string
                  description: Comma-separated tags
                  example: "delhi,travel,tourism"
                status:
                  type: string
                  enum: [draft, published]
                  default: draft
                featuredImage:
                  type: string
                  format: binary
                seo.metaTitle:
                  type: string
                  maxLength: 60
                seo.metaDescription:
                  type: string
                  maxLength: 160
                seo.keywords:
                  type: string
                  description: Comma-separated keywords
      responses:
        "201":
          description: Blog created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: "#/components/schemas/Blog"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /blogs/{slug}:
    get:
      tags: [Blog - Public]
      summary: Get blog by slug
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
          description: Blog slug
      responses:
        "200":
          description: Blog retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: "#/components/schemas/Blog"
        "404":
          $ref: "#/components/responses/NotFound"

  /blogs/{id}:
    patch:
      tags: [Blog - Admin]
      summary: Update a blog post
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Blog ID
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                title:
                  type: string
                content:
                  type: string
                excerpt:
                  type: string
                  nullable: true
                category:
                  type: string
                  enum: [Travel Tips, Destination Guides, Delhi Culture, Food & Cuisine, Adventure, News & Updates]
                tags:
                  type: string
                  description: Comma-separated tags
                status:
                  type: string
                  enum: [draft, published]
                featuredImage:
                  type: string
                  format: binary
                seo.metaTitle:
                  type: string
                  nullable: true
                seo.metaDescription:
                  type: string
                  nullable: true
                seo.keywords:
                  type: string
                  description: Comma-separated keywords
      responses:
        "200":
          description: Blog updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: "#/components/schemas/Blog"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      tags: [Blog - Admin]
      summary: Delete a blog post
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Blog ID
      responses:
        "200":
          description: Blog deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: null
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /blogs/upload-image:
    post:
      tags: [Blog - Admin]
      summary: Upload an image to Cloudinary
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
      responses:
        "200":
          description: Image uploaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      url:
                        type: string
                        example: https://res.cloudinary.com/example/image.jpg
                      publicId:
                        type: string
                        example: delhi-tour/blogs/image1
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

components:
  schemas:
    Blog:
      type: object
      properties:
        id:
          type: string
          example: 6864c31ad45b0d1234567890
        title:
          type: string
          example: Top 10 Places to Visit in Delhi
        slug:
          type: string
          example: top-10-places-to-visit-in-delhi
        content:
          type: string
          example: "<p>Delhi is a city rich in history...</p>"
        excerpt:
          type: string
          example: Discover the best attractions in Delhi
        featuredImage:
          type: object
          properties:
            url:
              type: string
              example: https://res.cloudinary.com/example/image.jpg
            publicId:
              type: string
              example: delhi-tour/blogs/image1
        category:
          type: string
          enum: [Travel Tips, Destination Guides, Delhi Culture, Food & Cuisine, Adventure, News & Updates]
        tags:
          type: array
          items:
            type: string
          example: [delhi, travel, tourism]
        author:
          $ref: "#/components/schemas/User"
        status:
          type: string
          enum: [draft, published]
          example: published
        publishedAt:
          type: string
          format: date-time
          nullable: true
        seo:
          type: object
          properties:
            metaTitle:
              type: string
              example: Top 10 Places to Visit in Delhi
            metaDescription:
              type: string
              example: Discover the best attractions in Delhi
            keywords:
              type: array
              items:
                type: string
              example: [delhi tourism, places to visit]
        views:
          type: integer
          example: 120
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Pagination:
      type: object
      properties:
        total:
          type: integer
          example: 50
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 10
        totalPages:
          type: integer
          example: 5

  responses:
    BadRequest:
      description: Bad request - validation error
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              message:
                type: string
                example: Validation failed
              errors:
                type: array
                items:
                  type: object
                  properties:
                    field:
                      type: string
                    message:
                      type: string

    Unauthorized:
      description: Unauthorized - authentication required
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              message:
                type: string
                example: You are not logged in

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              message:
                type: string
                example: Blog not found

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
