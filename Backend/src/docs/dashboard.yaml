tags:
  - name: Dashboard
    description: Admin dashboard statistics APIs

/admin/dashboard:
  get:
    tags:
      - Dashboard
    summary: Get dashboard statistics
    description: Returns aggregated statistics for the admin dashboard including summary counts, recent enquiries, category breakdown, and monthly trends.
    security:
      - bearerAuth: []

    responses:
      "200":
        description: Dashboard statistics fetched successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                message:
                  type: string
                  example: Dashboard statistics fetched successfully
                data:
                  type: object
                  properties:
                    summary:
                      type: object
                      properties:
                        totalEnquiries:
                          type: integer
                          example: 45
                        newLeads:
                          type: integer
                          example: 8
                        contacted:
                          type: integer
                          example: 12
                        quotationSent:
                          type: integer
                          example: 10
                        negotiating:
                          type: integer
                          example: 7
                        booked:
                          type: integer
                          example: 5
                        closed:
                          type: integer
                          example: 3
                        highPriority:
                          type: integer
                          example: 6
                        todayEnquiries:
                          type: integer
                          example: 4
                    recentEnquiries:
                      type: array
                      items:
                        type: object
                        properties:
                          _id:
                            type: string
                          enquiryNumber:
                            type: string
                          customerName:
                            type: string
                          customerPhone:
                            type: string
                          leadStatus:
                            type: string
                          priority:
                            type: string
                          tourPackage:
                            type: object
                            properties:
                              title:
                                type: string
                              category:
                                type: string
                          createdAt:
                            type: string
                            format: date-time
                    categoryStats:
                      type: array
                      items:
                        type: object
                        properties:
                          _id:
                            type: string
                            example: Domestic Tours
                          total:
                            type: integer
                            example: 15
                    monthlyTrend:
                      type: array
                      items:
                        type: object
                        properties:
                          _id:
                            type: object
                            properties:
                              year:
                                type: integer
                              month:
                                type: integer
                          enquiries:
                            type: integer
      "401":
        description: Unauthorized
      "403":
        description: Admin access required
