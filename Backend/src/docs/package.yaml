tags:
  - name: Tour Packages
    description: Tour package management APIs

/packages:
  get:
    tags:
      - Tour Packages
    summary: Get all active tour packages
    description: Returns all active tour packages sorted by newest first. Filtering and pagination should be handled by the frontend.

    responses:
      "200":
        description: Packages fetched successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                message:
                  type: string
                  example: Packages fetched successfully
                data:
                  type: array
                  items:
                    $ref: "#/components/schemas/TourPackage"

  post:
    tags:
      - Tour Packages
    summary: Create a new tour package
    description: Creates a new tour package. Requires admin privileges.
    security:
      - bearerAuth: []

    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - title
              - shortDescription
              - description
              - category
              - duration
              - price
            properties:
              title:
                type: string
                minLength: 5
                maxLength: 100
                example: Delhi Heritage Walk
              shortDescription:
                type: string
                minLength: 20
                maxLength: 200
                example: Explore the rich heritage of Old Delhi in a full-day guided tour
              description:
                type: string
                minLength: 50
                example: A comprehensive guided tour covering Red Fort, Jama Masjid, Chandni Chowk and the bustling streets of Old Delhi with authentic street food tasting
              destination:
                type: string
                default: Delhi
                example: Delhi
              category:
                type: string
                enum:
                  - Domestic Tours
                  - Trekking Expeditions
                  - Group Tours
                  - Honeymoon Packages
                  - Corporate Tours
              duration:
                type: string
                minLength: 3
                example: 2 Days
              price:
                type: number
                exclusiveMinimum: true
                example: 2999
              discountPrice:
                type: number
                minimum: 0
                default: 0
                example: 2499
              featured:
                type: boolean
                default: false
              highlights:
                type: array
                items:
                  type: string
                description: Key highlights of the tour
                example: ["Visit Red Fort", "Street food tour"]
              included:
                type: array
                items:
                  type: string
                description: What is included in the package
                example: ["Hotel accommodation", "Breakfast and lunch"]
              excluded:
                type: array
                items:
                  type: string
                description: What is not included in the package
                example: ["Travel insurance", "Personal expenses"]
              itinerary:
                type: array
                items:
                  type: object
                  required:
                    - day
                    - title
                    - description
                  properties:
                    day:
                      type: integer
                      example: 1
                    title:
                      type: string
                      example: Old Delhi Exploration
                    description:
                      type: string
                      example: Visit Red Fort, Jama Masjid and Chandni Chowk
                description: Day-by-day itinerary
              images:
                type: array
                items:
                  type: object
                  required:
                    - url
                    - publicId
                  properties:
                    url:
                      type: string
                      example: https://res.cloudinary.com/example/image.jpg
                    publicId:
                      type: string
                      example: delhi-tour/image1
                description: Package images (Cloudinary URLs)
              faq:
                type: array
                items:
                  type: object
                  required:
                    - question
                    - answer
                  properties:
                    question:
                      type: string
                      example: What is included in the tour?
                    answer:
                      type: string
                      example: Breakfast, lunch and hotel accommodation
                description: Frequently asked questions

    responses:
      "201":
        description: Package created successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                message:
                  type: string
                  example: Tour package created successfully
                data:
                  $ref: "#/components/schemas/TourPackage"
      "400":
        description: Validation failed
      "401":
        description: Unauthorized
      "403":
        description: Admin access required
      "409":
        description: Package with this title already exists

/packages/{slug}:
  get:
    tags:
      - Tour Packages
    summary: Get package by slug
    description: Returns a single package by its SEO-friendly slug, along with related packages from the same category.

    parameters:
      - in: path
        name: slug
        required: true
        schema:
          type: string
        description: Package slug
        example: delhi-heritage-walk

    responses:
      "200":
        description: Package details returned
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                message:
                  type: string
                  example: Package fetched successfully
                data:
                  type: object
                  properties:
                    package:
                      $ref: "#/components/schemas/TourPackage"
                    relatedPackages:
                      type: array
                      items:
                        $ref: "#/components/schemas/TourPackage"
      "404":
        description: Package not found

/packages/{id}:
  patch:
    tags:
      - Tour Packages
    summary: Update a package
    description: Updates an existing tour package. Only provided fields are updated. Requires admin privileges.
    security:
      - bearerAuth: []

    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
        description: Package MongoDB ID

    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              title:
                type: string
                minLength: 5
                maxLength: 100
              shortDescription:
                type: string
                minLength: 20
                maxLength: 200
              description:
                type: string
                minLength: 50
              destination:
                type: string
              category:
                type: string
                enum:
                  - Domestic Tours
                  - Trekking Expeditions
                  - Group Tours
                  - Honeymoon Packages
                  - Corporate Tours
              duration:
                type: string
              price:
                type: number
                exclusiveMinimum: true
              discountPrice:
                type: number
                minimum: 0
              featured:
                type: boolean
              isActive:
                type: boolean
              highlights:
                type: array
                items:
                  type: string
                description: Key highlights of the tour
              included:
                type: array
                items:
                  type: string
                description: What is included in the package
              excluded:
                type: array
                items:
                  type: string
                description: What is not included in the package
              itinerary:
                type: array
                items:
                  type: object
                  required:
                    - day
                    - title
                    - description
                  properties:
                    day:
                      type: integer
                    title:
                      type: string
                    description:
                      type: string
                description: Day-by-day itinerary
              images:
                type: array
                items:
                  type: object
                  required:
                    - url
                    - publicId
                  properties:
                    url:
                      type: string
                    publicId:
                      type: string
                description: Package images (Cloudinary URLs)
              faq:
                type: array
                items:
                  type: object
                  required:
                    - question
                    - answer
                  properties:
                    question:
                      type: string
                    answer:
                      type: string
                description: Frequently asked questions

    responses:
      "200":
        description: Package updated successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                message:
                  type: string
                  example: Package updated successfully
                data:
                  $ref: "#/components/schemas/TourPackage"
      "400":
        description: Validation failed
      "401":
        description: Unauthorized
      "403":
        description: Admin access required
      "404":
        description: Package not found

  delete:
    tags:
      - Tour Packages
    summary: Soft delete a package
    description: Sets the package isActive to false. The package is not removed from the database. Requires admin privileges.
    security:
      - bearerAuth: []

    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
        description: Package MongoDB ID

    responses:
      "200":
        description: Package deleted successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                message:
                  type: string
                  example: Package deleted successfully
      "401":
        description: Unauthorized
      "403":
        description: Admin access required
      "404":
        description: Package not found
