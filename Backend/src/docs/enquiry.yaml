tags:
  - name: Enquiries
    description: Tour enquiry and lead management APIs

/enquiries:
  post:
    tags:
      - Enquiries
    summary: Submit a tour enquiry
    description: Creates a new enquiry for a selected tour package. Open to everyone — no account or login required.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - customerName
              - customerEmail
              - customerPhone
              - tourPackage
              - travelDate
              - adults
            properties:
              customerName:
                type: string
                minLength: 2
                maxLength: 80
                description: Full name of the customer
                example: Rahul Sharma
              customerEmail:
                type: string
                format: email
                maxLength: 120
                description: Customer email
                example: rahul@example.com
              customerPhone:
                type: string
                pattern: "^\\+?[0-9]{10,15}$"
                description: Customer phone number (10-15 digits, optional + prefix)
                example: "9876543210"
              tourPackage:
                type: string
                description: Tour package MongoDB ID
                example: "6864c31ad45b0d1234567890"
              travelDate:
                type: string
                format: date
                description: Intended travel date
                example: "2026-08-15"
              adults:
                type: integer
                minimum: 1
                description: Number of adults (at least 1)
                example: 2
              children:
                type: integer
                minimum: 0
                default: 0
                description: Number of children
                example: 1
              notes:
                type: string
                maxLength: 1000
                description: Any additional notes or requirements
                example: Need pickup from airport

    responses:
      "201":
        description: Enquiry created successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                message:
                  type: string
                  example: Enquiry submitted successfully
                data:
                  $ref: "#/components/schemas/Enquiry"
      "400":
        description: Validation failed
      "404":
        description: Tour package not found

/enquiries/lookup:
  get:
    tags:
      - Enquiries
    summary: Look up an enquiry (public)
    description: Public endpoint that lets visitors track their enquiry status using the email/phone they submitted with. Optionally refine by enquiry number.
    parameters:
      - in: query
        name: email
        schema:
          type: string
          format: email
        description: Customer email used at the time of the enquiry
        example: rahul@example.com
      - in: query
        name: phone
        schema:
          type: string
        description: Customer phone used at the time of the enquiry
        example: "9876543210"
      - in: query
        name: enquiryNumber
        schema:
          type: string
        description: Optional enquiry reference number
        example: ENQ-2026-0001

    responses:
      "200":
        description: Enquiry found
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                message:
                  type: string
                  example: Enquiry found
                data:
                  $ref: "#/components/schemas/Enquiry"
      "404":
        description: No enquiry found matching the provided details

/admin/enquiries:
  get:
    tags:
      - Admin
    summary: Get all enquiries (admin)
    description: Returns a paginated list of all enquiries with optional filtering by lead status, lead source, and search.
    security:
      - bearerAuth: []

    parameters:
      - in: query
        name: page
        schema:
          type: integer
          default: 1
        description: Page number
        example: 1

      - in: query
        name: limit
        schema:
          type: integer
          default: 10
        description: Items per page
        example: 10

      - in: query
        name: leadStatus
        schema:
          type: string
          enum:
            - New
            - Contacted
            - Quotation Sent
            - Negotiating
            - Booked
            - Closed
        description: Filter by lead status

      - in: query
        name: leadSource
        schema:
          type: string
          enum:
            - Website
            - Instagram
            - Facebook
            - WhatsApp
            - Referral
            - Walk-in
            - Phone
        description: Filter by lead source

      - in: query
        name: search
        schema:
          type: string
        description: Search by customer name or email
        example: Rahul

      - in: query
        name: sort
        schema:
          type: string
          enum:
            - latest
            - oldest
        default: latest
        description: Sort order

    responses:
      "200":
        description: All enquiries fetched successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                message:
                  type: string
                  example: All enquiries fetched successfully
                data:
                  type: object
                  properties:
                    total:
                      type: integer
                      example: 45
                    page:
                      type: integer
                      example: 1
                    totalPages:
                      type: integer
                      example: 5
                    enquiries:
                      type: array
                      items:
                        $ref: "#/components/schemas/Enquiry"
      "401":
        description: Unauthorized
      "403":
        description: Admin access required

/admin/enquiries/{id}:
  patch:
    tags:
      - Admin
    summary: Update an enquiry (admin)
    description: Updates enquiry lead status, source, priority, or follow-up date. Automatically sets lastContactedAt when status changes to Contacted. Requires admin privileges.
    security:
      - bearerAuth: []

    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
        description: Enquiry MongoDB ID

    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              leadStatus:
                type: string
                enum:
                  - New
                  - Contacted
                  - Quotation Sent
                  - Negotiating
                  - Booked
                  - Closed
                description: Current status of the lead
              leadSource:
                type: string
                enum:
                  - Website
                  - Instagram
                  - Facebook
                  - WhatsApp
                  - Referral
                  - Walk-in
                  - Phone
                description: How the lead was acquired
              priority:
                type: string
                enum:
                  - Low
                  - Medium
                  - High
                description: Priority level of the enquiry
              followUpDate:
                type: string
                format: date
                nullable: true
                description: Scheduled follow-up date
                example: "2026-08-20"
              lastContactedAt:
                type: string
                format: date-time
                nullable: true
                description: Last contact timestamp (auto-set when leadStatus changes to Contacted)
              remarks:
                type: string
                maxLength: 1000
                description: Internal notes or remarks about the enquiry

    responses:
      "200":
        description: Enquiry updated successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                message:
                  type: string
                  example: Enquiry updated successfully
                data:
                  $ref: "#/components/schemas/Enquiry"
      "400":
        description: Validation failed
      "401":
        description: Unauthorized
      "403":
        description: Admin access required
      "404":
        description: Enquiry not found

  delete:
    tags:
      - Admin
    summary: Delete an enquiry (admin)
    description: Permanently deletes an enquiry. Requires admin privileges.
    security:
      - bearerAuth: []

    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
        description: Enquiry MongoDB ID

    responses:
      "200":
        description: Enquiry deleted successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                message:
                  type: string
                  example: Enquiry deleted successfully
      "401":
        description: Unauthorized
      "403":
        description: Admin access required
      "404":
        description: Enquiry not found